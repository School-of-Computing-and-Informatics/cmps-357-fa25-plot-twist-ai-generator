<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit {{ story.title }} - PlotTwist</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">🎭 PlotTwist</h1>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/stories">My Stories</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <h2>Edit Story</h2>
        
        <form id="editForm" class="edit-form">
            <div class="form-group">
                <label for="title">Title:</label>
                <input type="text" id="title" name="title" value="{{ story.title }}" required>
            </div>
            
            <div class="form-group">
                <label for="text">Story:</label>
                <textarea id="text" name="text" rows="15" required>{{ story.text }}</textarea>
            </div>
            
            <div class="story-actions">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="/story/{{ story.id }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 PlotTwist. Powered by Markov Chains & Flask.</p>
        </div>
    </footer>

    <script>
        const form = document.getElementById('editForm');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const title = document.getElementById('title').value;
            const text = document.getElementById('text').value;
            
            try {
                const response = await fetch('/story/{{ story.id }}/edit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title: title,
                        text: text
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    window.location.href = '/story/{{ story.id }}';
                } else {
                    alert('Failed to save changes.');
                }
            } catch (error) {
                console.error('Error saving story:', error);
                alert('Failed to save changes.');
            }
        });
    </script>
</body>
</html>
